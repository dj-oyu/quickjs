name: ci-probe
on:
  workflow_dispatch:
jobs:
  meson:
    runs-on: ${{ matrix.platform }}
    name: meson on ${{ matrix.platform }} (${{ matrix.mode.name }} ${{ matrix.flavor }}, ${{ matrix.features.name }})
    strategy:
      fail-fast: false
      matrix:
        flavor: [debug]
        features:
          - name: default
            args: ""
        platform: [windows-latest]
        mode:
          - name: clang-cl+sanitize
            args: >-
              "-Db_sanitize=address,undefined"
              "-Db_lundef=false"
              "-Db_vscrt=md"
            extra_envs:
              CC: clang-cl
              CXX: clang-cl
              ASAN_OPTIONS: report_globals=0:halt_on_error=1:abort_on_error=1:print_summary=1
    steps:
      - name: Setup meson
        run: |
          pipx install meson ninja
      - name: Install mimalloc
        if: ${{ matrix.platform == 'ubuntu-latest' && matrix.features.name == 'mimalloc' }}
        run: sudo apt update && sudo apt -y install libmimalloc-dev
      - name: Install mimalloc
        if: ${{ matrix.platform == 'macos-latest' && matrix.features.name == 'mimalloc' }}
        run: brew install mimalloc
      # TODO: Install mimalloc on Windows
      # You need to:
      # - checkout mimalloc
      # - `msbuild mimalloc\ide\vs2022\mimalloc.sln`
      #   - not cmake, because https://github.com/microsoft/mimalloc/issues/575#issuecomment-1112723975
      #   - it is possible to integrate vcpkg with meson, but:
      #     - 1. the above issue
      #     - 2. the vcpkg port of mimalloc is outdated, and still broken on server 2019
      #   - or maintain a meson port for mimalloc (and ensure it behaves correctly)
      # - Make it findable with cmake
      #   - not the simpler pkg-config. although there was pkg-config in PATH,
      #     but that was from strawberry perl and thus broken
      # ... good job, microsoft :))))

      - name: Checkout
        uses: actions/checkout@v7
      - name: Activate MSVC and Configure
        if: ${{ matrix.platform == 'windows-latest' }}
        env: ${{ matrix.mode.extra_envs }}
        run: |
          $extraArgs = @()
          if ($env:CC -eq 'clang-cl') {
            # Newer clang-cl no longer emits the asan runtime /defaultlib directives
            # when -fsanitize is passed through /clang:, and meson links with lld-link
            # directly (not the clang driver), so the asan/ubsan runtime is never pulled
            # in. Link it explicitly and make its directory discoverable at link and run
            # time (the dynamic runtime ships as a DLL).
            $runtimeDir = (clang -print-runtime-dir).Trim()
            $env:LIB = "$runtimeDir;$env:LIB"
            "LIB=$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $runtimeDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $libs = "clang_rt.asan_dynamic-x86_64.lib clang_rt.asan_dynamic_runtime_thunk-x86_64.lib"
            $extraArgs = @("-Dc_link_args=$libs", "-Dcpp_link_args=$libs")
          }
          meson setup build-${{ matrix.flavor }} --buildtype=${{ matrix.flavor }} ${{ matrix.mode.args }} ${{ matrix.features.args }} --vsenv @extraArgs
          if ($env:CC -eq 'clang-cl') {
            # The tests run under --vsenv, whose PATH puts Visual Studio's own
            # LLVM first: its clang_rt.asan_dynamic DLL is another version than
            # the import library linked above (STATUS_ENTRYPOINT_NOT_FOUND at
            # load). Windows looks next to the executable first.
            Copy-Item (Join-Path $runtimeDir "clang_rt.asan_dynamic-x86_64.dll") build-${{ matrix.flavor }}
          }
      - name: Configuring
        if: ${{ matrix.platform != 'windows-latest' }}
        env: ${{ matrix.mode.extra_envs }}
        run: |
          meson setup build-${{ matrix.flavor }} --buildtype=${{ matrix.flavor }} ${{ matrix.mode.args }} ${{ matrix.features.args }}
      - name: Building
        run: |
          meson compile -C build-${{ matrix.flavor }}

      - name: Running tests
        env: ${{ matrix.mode.extra_envs }}
        run: |
          meson test -C build-${{ matrix.flavor }} --timeout-multiplier 5 --print-errorlogs
          meson test --benchmark -C build-${{ matrix.flavor }} --timeout-multiplier 5 --print-errorlogs
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ matrix.platform }}-${{ matrix.mode.name }}-${{ matrix.features.name }}-${{ matrix.flavor }}-logs
          path: build-${{ matrix.flavor }}/meson-logs
